# calisto — CI de release (Fase Q.1): a cada tag v* compila o binario, monta
# os tarballs (release.sh) e publica o GitHub Release com sha256.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas do build do ruby
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libyaml-dev pkg-config

      - name: Cache do vendor (build de 10-15min por versao)
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/build-ruby.sh') }}

      - name: Build do CRuby pinado
        run: scripts/build-ruby.sh

      - name: Tarballs de release
        run: scripts/release.sh "${{ github.ref_name }}"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.tar.gz dist/*.sha256 \
            --title "calisto ${{ github.ref_name }}" \
            --generate-notes
