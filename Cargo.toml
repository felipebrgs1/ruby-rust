[package]
name = "calisto"
version = "0.1.0"
edition = "2021"
description = "A Bun-like runtime for Ruby: pinned CRuby 3.4 + fork-based fast startup"

[[bin]]
name = "calisto"
path = "src/main.rs"

[[test]]
name = "cli"
path = "test/cli.rs"

[[test]]
name = "stdio"
path = "test/stdio.rs"

[[test]]
name = "daemon"
path = "test/daemon.rs"

[[test]]
name = "preload"
path = "test/preload.rs"

[profile.release]
lto = true
strip = true
