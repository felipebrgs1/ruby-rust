[package]
name = "calisto"
version = "0.1.0"
edition = "2021"
description = "A Bun-like runtime for Ruby: pinned CRuby 3.4 + fork-based fast startup"

# Workspace futuro: cada modulo em crates/calisto-<modulo> vira um crate quase
# independente (build/test isolados), agregado pelo binario calisto-cli.
# Members entram aqui quando cada crate ganhar Cargo.toml.
[workspace]
members = ["crates/calisto-build"]

[dependencies]
calisto-build = { path = "crates/calisto-build" }

[[bin]]
name = "calisto"
path = "src/main.rs"

[[test]]
name = "cli"
path = "test/cli.rs"

[[test]]
name = "stdio"
path = "test/stdio.rs"

[[test]]
name = "daemon"
path = "test/daemon.rs"

[[test]]
name = "preload"
path = "test/preload.rs"

[[test]]
name = "build"
path = "test/build.rs"

[[test]]
name = "ruby_upstream"
path = "test/ruby_upstream.rs"

[[test]]
name = "bundler"
path = "test/bundler.rs"

[[test]]
name = "app"
path = "test/app.rs"

[[test]]
name = "testcmd"
path = "test/testcmd.rs"

[[test]]
name = "exec"
path = "test/exec.rs"

[[test]]
name = "scripts"
path = "test/scripts.rs"

[[test]]
name = "versions"
path = "test/versions.rs"

[[test]]
name = "realapps"
path = "test/realapps.rs"

[profile.release]
lto = true
strip = true
